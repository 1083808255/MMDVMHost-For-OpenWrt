name: Build G4KLX MMDVMHost and Gateway

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # X86 架构
          - target: x86
            arch: x86_64
            sdk_url: https://downloads.openwrt.org/releases/24.10.5/targets/x86/64/openwrt-sdk-24.10.5-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          # MT7628 架构
          - target: mt76x8
            arch: mipsel_24kc
            sdk_url: https://downloads.openwrt.org/releases/24.10.5/targets/ramips/mt76x8/openwrt-sdk-24.10.5-ramips-mt76x8_gcc-13.3.0_musl.Linux-x86_64.tar.zst

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: mmdvm-src

      # 缓存 feeds，避免每次重复拉取庞大的包索引
      - name: Cache OpenWrt Feeds
        uses: actions/cache@v4
        with:
          path: sdk/feeds
          key: ${{ runner.os }}-feeds-${{ matrix.target }}-${{ hashFiles('**/feeds.conf.default') }}
          restore-keys: |
            ${{ runner.os }}-feeds-${{ matrix.target }}-

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git subversion libssl-dev gettext unzip zlib1g-dev file python3 python3-setuptools wget zstd

      - name: Download OpenWrt SDK
        run: |
          wget -q ${{ matrix.sdk_url }}
          tar --use-compress-program=unzstd -xf openwrt-sdk-*.tar.zst
          mv openwrt-sdk-*/ sdk
          
      - name: Setup and Compile
        run: |
          cd sdk
          export TERM=xterm
          
          # 1. 封杀超时源
          sudo echo "127.0.0.1 mirror2.openwrt.org" | sudo tee -a /etc/hosts
          sed -i 's/mirror2.openwrt.org/sources.cdn.openwrt.org/g' scripts/download.pl
          sed -i 's/mirror1.openwrt.org/sources.cdn.openwrt.org/g' scripts/download.pl
          
          # 2. 物理删除可能存在的旧配置文件（防止缓存冲突）
          rm -f .config
          
          cp feeds.conf.default feeds.conf
          echo "src-git mmdvm file://$GITHUB_WORKSPACE/mmdvm-src" >> feeds.conf
          
          ./scripts/feeds update -a
          ./scripts/feeds install mmdvm-host dmr-gateway
          ./scripts/feeds install nlohmannjson || true
          
          echo "=== 生成极简配置 ==="
          # 3. 强制指定架构并生成新配置
          echo "${{ matrix.target == 'x86' && 'CONFIG_TARGET_x86=y\nCONFIG_TARGET_x86_64=y' || 'CONFIG_TARGET_ramips=y\nCONFIG_TARGET_ramips_mt76x8=y\nCONFIG_TARGET_ramips_mt76x8_DEVICE_generic=y' }}" > .config
          echo "CONFIG_PACKAGE_mmdvm-host=m" >> .config
          echo "CONFIG_PACKAGE_dmr-gateway=m" >> .config
          echo "CONFIG_PACKAGE_nlohmannjson=y" >> .config
          
          # 4. 终极防御：使用 yes 自动回车，并强制生成配置
          yes "" | make defconfig
          
          # 5. 多线程预下载（加入 -i 忽略部分下载失败）
          make download -j8 V=w -i
          
          echo "=== 编译 MMDVMHost ==="
          make package/mmdvm-host/compile -j$(nproc) V=w
          
          echo "=== 编译 DMRGateway ==="
          make package/dmr-gateway/compile -j$(nproc) V=w

      - name: Collect IPKs
        run: |
          DEST_DIR="mmdvm-src/ipk/ipk-${{ matrix.target }}"
          mkdir -p "$DEST_DIR"
          cp sdk/bin/packages/${{ matrix.arch }}/*/*.ipk "$DEST_DIR/" || true
          
          cd "$DEST_DIR"
          echo "Architecture: ${{ matrix.arch }}" > Packages
          for f in *.ipk; do
            if [ -f "$f" ]; then
              echo "Package: ${f%%_*}"
              echo "Version: $(echo $f | cut -d_ -f2)"
              echo "Architecture: ${{ matrix.arch }}"
              echo "Filename: $f"
              echo "Size: $(stat -c %s $f)"
              echo "Description: Auto generated package $f"
              echo ""
            fi
          done >> Packages
          gzip -c Packages > Packages.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: G4KLX-MMDVM-${{ matrix.target }}
          path: mmdvm-src/ipk/ipk-${{ matrix.target }}/*.ipk

      - name: Auto Commit to Repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: mmdvm-src
          commit_message: "Auto-build: Update G4KLX IPKs for ${{ matrix.target }}"
          branch: main
          file_pattern: ipk/**/*
