name: Build G4KLX MMDVMHost and Gateway

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86
            arch: x86_64
            sdk_url: https://downloads.openwrt.org/releases/24.10.5/targets/x86/64/openwrt-sdk-24.10.5-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          - target: mt76x8
            arch: mipsel_24kc
            sdk_url: https://downloads.openwrt.org/releases/24.10.5/targets/ramips/mt76x8/openwrt-sdk-24.10.5-ramips-mt76x8_gcc-13.3.0_musl.Linux-x86_64.tar.zst

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: mmdvm-src

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git subversion libssl-dev gettext unzip zlib1g-dev file python3 python3-setuptools wget zstd

      - name: Download OpenWrt SDK
        run: |
          wget ${{ matrix.sdk_url }}
          tar --use-compress-program=unzstd -xf openwrt-sdk-*.tar.zst
          mv openwrt-sdk-*/ sdk
          
      - name: Setup Feeds and Compile
        run: |
          cd sdk
          export TERM=xterm
          
          cp feeds.conf.default feeds.conf
          echo "src-git mmdvm file://$GITHUB_WORKSPACE/mmdvm-src" >> feeds.conf
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p mmdvm
          make defconfig
          
          echo "=== 编译最新版 MMDVMHost 与 DMRGateway ==="
          make package/mmdvm-host/compile V=s || true
          make package/dmr-gateway/compile V=s || true

      - name: Collect IPKs
        run: |
          DEST_DIR="mmdvm-src/ipk/ipk-${{ matrix.target }}"
          mkdir -p "$DEST_DIR"
          
          # 抓取所有编译出来的 ipk (包括自动编译的依赖库)
          cp sdk/bin/packages/${{ matrix.arch }}/*/*.ipk "$DEST_DIR/" || true
          
          # 生成索引文件
          cd "$DEST_DIR"
          echo "Architecture: ${{ matrix.arch }}" > Packages
          for f in *.ipk; do
            if [ -f "$f" ]; then
              echo "Package: ${f%%_*}"
              echo "Version: $(echo $f | cut -d_ -f2)"
              echo "Architecture: ${{ matrix.arch }}"
              echo "Filename: $f"
              echo "Size: $(stat -c %s $f)"
              echo "Description: Auto generated package $f"
              echo ""
            fi
          done >> Packages
          gzip -c Packages > Packages.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: G4KLX-MMDVM-${{ matrix.target }}
          path: sdk/bin/packages/${{ matrix.arch }}/*/*.ipk

      - name: Auto Commit to Repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: mmdvm-src
          commit_message: "Auto-build: Update G4KLX IPKs for ${{ matrix.target }}"
          branch: main
          file_pattern: ipk/**/*
